services:

  mysql:
    image: mysql:8.0
    container_name: hope-medical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medical_db
      MYSQL_USER: medicaluser
      MYSQL_PASSWORD: medicalpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hope-medical-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "medicaluser", "-pmedicalpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: hope-medical-backend
    container_name: hope-medical-backend
    restart: unless-stopped
    environment:
      DB_HOST: hope-medical-mysql
      DB_USER: medicaluser
      DB_PASSWORD: medicalpassword
      DB_NAME: medical_db
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hope-medical-network

  frontend:
    build:
      context: ./frontend
    image: hope-medical-frontend
    container_name: hope-medical-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - hope-medical-network

networks:
  hope-medical-network:
    driver: bridge

volumes:
  mysql_data: